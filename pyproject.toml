[project]
name = "ebay-signal"
version = "0.1.0"
description = "eBay HTML monitoring with Telegram sign-in and notifications"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0.38,<3",
  "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3",
  "jinja2>=3.1.6,<4",
  "curl-cffi>=0.13,<1",
  "playwright>=1.56,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

